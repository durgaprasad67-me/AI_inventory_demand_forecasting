<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #9ec5ff, #d7e7ff);
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    width: min(92vw, 360px);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 18px 50px rgba(26, 57, 114, 0.2);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
}

.hint {
    margin-top: 4px;
    font-size: 12px;
    color: #4c5c7a;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #b7c7e7;
    border-radius: 8px;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 64px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    margin: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    display: grid;
    place-items: center;
}

.toggle-password svg {
    width: 19px;
    height: 19px;
    fill: #3a3a3a;
    pointer-events: none;
}

button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #1f5fbf;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#msg {
    min-height: 20px;
    margin-top: 10px;
    font-size: 14px;
}

.switch-link {
    margin-top: 12px;
    font-size: 14px;
}
</style>
</head>
<body>
    <form class="card" id="registerForm">
        <h2>Create account</h2>
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            minlength="3"
            pattern="[A-Za-z][A-Za-z0-9]*"
            title="Username must start with a letter and use only letters/numbers (example: Username123)"
            required
        />
        <div class="hint">Username: start with letter, and use only letters/numbers (example: Username123).</div>
        <label for="password">Password</label>
        <div class="password-wrap">
            <input
                id="password"
                name="password"
                type="password"
                minlength="6"
                pattern="(?=.*\d)(?=.*[^A-Za-z0-9]).{6,}"
                title="Password must be at least 6 characters and include at least 1 number and 1 special character"
                required
            />
            <button id="togglePassword" class="toggle-password" type="button" aria-label="Show password"></button>
        </div>
        <div class="hint">Password: minimum 6 characters, at least 1 number, at least 1 special character.</div>
        <label for="confirm_password">Confirm Password</label>
        <div class="password-wrap">
            <input id="confirm_password" name="confirm_password" type="password" minlength="6" required />
            <button id="toggleConfirmPassword" class="toggle-password" type="button" aria-label="Show confirm password"></button>
        </div>
        <button type="submit">Register</button>
        <div id="msg"></div>
        <div class="switch-link">Already have an account? <a id="loginLink" href="/login">Login here</a></div>
    </form>

<script>
const form = document.getElementById("registerForm");
const msg = document.getElementById("msg");
const loginLink = document.getElementById("loginLink");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirm_password");
const togglePassword = document.getElementById("togglePassword");
const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
const signedQuery = window.location.search || "";

if (loginLink && signedQuery) {
    loginLink.href = `/login${signedQuery}`;
}

function wirePasswordToggle(button, input) {
    if (!button || !input) return;
    const eyeSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5.5 0-9.5 4.5-10.8 6 .4.5 4.5 8 10.8 8s10.4-7.5 10.8-8C21.5 9.5 17.5 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/><circle cx="12" cy="12" r="2.1"/></svg>';
    const eyeOffSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.7 1.3 1.3 2.7l3 3C2.7 7.2 1.6 8.8 1 9.6c.4.6 4.5 8.4 11 8.4 2 0 3.8-.6 5.3-1.4l3 3 1.4-1.4L2.7 1.3zM7.7 9l1.6 1.6A3.5 3.5 0 0 0 13.4 15l1.6 1.6c-.9.3-1.9.4-3 .4-4.2 0-7.5-4.4-8.8-6 .5-.7 2-2.7 4.5-4z"/><path d="M12 6c4.2 0 7.6 4.4 8.8 6-.4.6-1.5 2.1-3.1 3.5l-1.4-1.4c1.1-.9 1.9-1.8 2.3-2.3-1.3-1.6-4.6-4.8-8.6-4.8-.7 0-1.4.1-2 .2L6.5 5.7C8 6.2 9.9 6 12 6z"/></svg>';
    button.innerHTML = eyeSvg;
    button.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.innerHTML = show ? eyeOffSvg : eyeSvg;
    });
}

wirePasswordToggle(togglePassword, passwordInput);
wirePasswordToggle(toggleConfirmPassword, confirmPasswordInput);

function formatRegisterError(data) {
    const detail = data?.detail;
    if (typeof detail === "string") {
        return detail;
    }
    if (detail && typeof detail === "object") {
        return detail.message || "Registration failed";
    }
    return "Registration failed";
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "Creating account...";
    msg.style.color = "black";

    const body = new URLSearchParams();
    body.append("username", form.username.value);
    body.append("password", form.password.value);
    body.append("confirm_password", form.confirm_password.value);

    try {
        const res = await fetch(`/register${signedQuery}`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
        });
        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
            throw new Error("Server returned HTML instead of JSON. Open the app from the Space UI and try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(formatRegisterError(data));
        msg.textContent = "Registered successfully. Redirecting to login...";
        msg.style.color = "green";
        setTimeout(() => {
            window.location.href = `/login${signedQuery}`;
        }, 800);
    } catch (err) {
        msg.textContent = err.message;
        msg.style.color = "red";
    }
});
</script>
</body>
</html>
