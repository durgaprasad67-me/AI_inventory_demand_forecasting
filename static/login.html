<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #9ec5ff, #d7e7ff);
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    width: min(92vw, 360px);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 18px 50px rgba(26, 57, 114, 0.2);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
}

.hint {
    margin-top: 4px;
    font-size: 12px;
    color: #4c5c7a;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #b7c7e7;
    border-radius: 8px;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 64px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    margin: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    border: none;
    background: #ffffff;
    box-shadow: none;
    display: grid;
    place-items: center;
}

.toggle-password svg {
    width: 19px;
    height: 19px;
    fill: #3a3a3a;
    pointer-events: none;
}

button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #1f5fbf;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.3s ease, background-color 0.3s ease;
}

button:hover,
button:focus-visible {
    color: #f5eeee;
    background: #5cb85c;
}

#msg {
    min-height: 20px;
    margin-top: 10px;
    font-size: 14px;
}

.switch-link {
    margin-top: 12px;
    font-size: 14px;
}
</style>
</head>
<body>
    <form class="card" id="loginForm">
        <h2>Sign in</h2>
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            required
        />
        <label for="password">Password</label>
        <div class="password-wrap">
            <input
                id="password"
                name="password"
                type="password"
                required
            />
            <button id="togglePassword" class="toggle-password" type="button" aria-label="Show password"></button>
        </div>
        <button type="submit">Login</button>
        <div id="msg"></div>
        <div class="switch-link">New user? <a id="registerLink" href="/register">Register here</a></div>
    </form>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const registerLink = document.getElementById("registerLink");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const signedQuery = window.location.search || "";

if (registerLink && signedQuery) {
    registerLink.href = `/register${signedQuery}`;
}

if (togglePassword && passwordInput) {
    const eyeSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-5.5 0-9.5 4.5-10.8 6 .4.5 4.5 8 10.8 8s10.4-7.5 10.8-8C21.5 9.5 17.5 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/><circle cx="12" cy="12" r="2.1"/></svg>';
    const eyeOffSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.7 1.3 1.3 2.7l3 3C2.7 7.2 1.6 8.8 1 9.6c.4.6 4.5 8.4 11 8.4 2 0 3.8-.6 5.3-1.4l3 3 1.4-1.4L2.7 1.3zM7.7 9l1.6 1.6A3.5 3.5 0 0 0 13.4 15l1.6 1.6c-.9.3-1.9.4-3 .4-4.2 0-7.5-4.4-8.8-6 .5-.7 2-2.7 4.5-4z"/><path d="M12 6c4.2 0 7.6 4.4 8.8 6-.4.6-1.5 2.1-3.1 3.5l-1.4-1.4c1.1-.9 1.9-1.8 2.3-2.3-1.3-1.6-4.6-4.8-8.6-4.8-.7 0-1.4.1-2 .2L6.5 5.7C8 6.2 9.9 6 12 6z"/></svg>';
    togglePassword.innerHTML = eyeSvg;
    togglePassword.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePassword.innerHTML = show ? eyeOffSvg : eyeSvg;
        togglePassword.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "Signing in...";
    msg.style.color = "black";

    const body = new URLSearchParams();
    body.append("username", form.username.value);
    body.append("password", form.password.value);

    try {
        const res = await fetch(`/login${signedQuery}`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
        });
        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
            throw new Error("Server returned HTML instead of JSON. Open the app from the Space UI and try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");
        window.location.href = `/${signedQuery}`;
    } catch (err) {
        msg.textContent = err.message;
        msg.style.color = "red";
    }
});
</script>
</body>
</html>
