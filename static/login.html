<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #9ec5ff, #d7e7ff);
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    width: min(92vw, 360px);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 18px 50px rgba(26, 57, 114, 0.2);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
}

.hint {
    margin-top: 4px;
    font-size: 12px;
    color: #4c5c7a;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #b7c7e7;
    border-radius: 8px;
}

.password-wrap {
    position: relative;
}

.password-wrap input {
    padding-right: 64px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    margin-top: 0;
    width: auto;
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid #b7c7e7;
    background: #ffffff;
    color: #1f5fbf;
    font-weight: 600;
}

button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #1f5fbf;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.3s ease, background-color 0.3s ease;
}

button:hover,
button:focus-visible {
    color: #f5eeee;
    background: #5cb85c;
}

#msg {
    min-height: 20px;
    margin-top: 10px;
    font-size: 14px;
}

.switch-link {
    margin-top: 12px;
    font-size: 14px;
}
</style>
</head>
<body>
    <form class="card" id="loginForm">
        <h2>Sign in</h2>
        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            type="text"
            required
        />
        <label for="password">Password</label>
        <div class="password-wrap">
            <input
                id="password"
                name="password"
                type="password"
                required
            />
            <button id="togglePassword" class="toggle-password" type="button" aria-label="Show password">Show</button>
        </div>
        <button type="submit">Login</button>
        <div id="msg"></div>
        <div class="switch-link">New user? <a id="registerLink" href="/register">Register here</a></div>
    </form>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const registerLink = document.getElementById("registerLink");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const signedQuery = window.location.search || "";

if (registerLink && signedQuery) {
    registerLink.href = `/register${signedQuery}`;
}

if (togglePassword && passwordInput) {
    togglePassword.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePassword.textContent = show ? "Hide" : "Show";
        togglePassword.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "Signing in...";
    msg.style.color = "black";

    const body = new URLSearchParams();
    body.append("username", form.username.value);
    body.append("password", form.password.value);

    try {
        const res = await fetch(`/login${signedQuery}`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
        });
        const contentType = res.headers.get("content-type") || "";
        if (!contentType.includes("application/json")) {
            throw new Error("Server returned HTML instead of JSON. Open the app from the Space UI and try again.");
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");
        window.location.href = "/";
    } catch (err) {
        msg.textContent = err.message;
        msg.style.color = "red";
    }
});
</script>
</body>
</html>
