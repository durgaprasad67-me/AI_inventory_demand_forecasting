<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #9ec5ff, #d7e7ff);
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    width: min(92vw, 360px);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 18px 50px rgba(26, 57, 114, 0.2);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #b7c7e7;
    border-radius: 8px;
}

button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #1f5fbf;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#msg {
    min-height: 20px;
    margin-top: 10px;
    font-size: 14px;
}

.switch-link {
    margin-top: 12px;
    font-size: 14px;
}
</style>
</head>
<body>
    <form class="card" id="loginForm">
        <h2>Sign in</h2>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
        <button type="submit">Login</button>
        <div id="msg"></div>
        <div class="switch-link">New user? <a href="/register">Register here</a></div>
    </form>

<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "Signing in...";
    msg.style.color = "black";

    const body = new URLSearchParams();
    body.append("username", form.username.value);
    body.append("password", form.password.value);

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Login failed");
        window.location.href = "/";
    } catch (err) {
        msg.textContent = err.message;
        msg.style.color = "red";
    }
});
</script>
</body>
</html>
